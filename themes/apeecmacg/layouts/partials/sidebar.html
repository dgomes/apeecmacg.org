<aside class="sidebar" aria-label="A associação">
  {{ range hugo.Data.sidebar }}
  <section class="widget">
    <h2>{{ .title }}</h2>
    <div>{{ .html | safeHTML }}</div>
  </section>
  {{ end }}
  <section class="widget search-widget">
    <h2>Pesquisa</h2>
    <form action="{{ "pesquisa/" | relURL }}" role="search">
      <label class="visually-hidden" for="sidebar-search">Pesquisar no site</label>
      <div class="search-field"><input id="sidebar-search" type="search" name="q" placeholder="Pesquisar …" required><button type="submit" aria-label="Pesquisar"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10" cy="10" r="6"></circle><path d="m15 15 6 6"></path></svg></button></div>
    </form>
  </section>
</aside>
